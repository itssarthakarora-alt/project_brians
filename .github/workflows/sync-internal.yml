# Pipeline 2 — Keep internal.php in sync (GitHub is the source of truth)
# Triggers:
#   - every push that touches internal.php (immediate sync)
#   - every 15 minutes (scheduled drift check)
#   - manual run from the Actions tab
# If the server's internal.php differs from GitHub's, GitHub's copy is pushed up.
name: Sync internal.php (GitHub → GoDaddy)

on:
  push:
    paths:
      - 'internal.php'
      - 'internal3.php'
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, offset to avoid top-of-hour load
  workflow_dispatch:

jobs:
  sync:
    name: Check and sync internal.php
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for f in internal.php internal3.php; do
            if [ -f "$f" ]; then
              sed -i "s|__TELEGRAM_BOT_TOKEN__|${TELEGRAM_BOT_TOKEN}|g" "$f"
              if grep -q "__TELEGRAM_BOT_TOKEN__" "$f"; then
                echo "Token injection failed in $f — placeholder still present."
                exit 1
              fi
            else
              echo "Warning: $f not found, skipping."
              exit 1
            fi
          done

      - name: Compare internal files with the server copies
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # This FTP account opens directly inside public_html/jerryscvv.vc/,
          # so these files live at the root of the FTP account.
          for FILE in internal.php internal3.php; do
            FTP_URL="ftp://${FTP_SERVER}/${FILE}"
            echo "Checking server copy: ${FTP_URL}"

            if curl --silent --show-error --connect-timeout 30 \
                -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
                "${FTP_URL}" -o "/tmp/remote-${FILE}"; then

              if cmp -s "${FILE}" "/tmp/remote-${FILE}"; then
                echo "OK: ${FILE} is already in sync - nothing to do."
              else
                echo "CHANGED: difference detected - uploading GitHub's ${FILE}."
                curl --silent --show-error --connect-timeout 30 \
                  -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
                  -T "${FILE}" "${FTP_URL}"
              fi

            else
              echo "MISSING: ${FILE} not found on the server - uploading it from GitHub."
              curl --silent --show-error --connect-timeout 30 \
                -u "${FTP_USERNAME}:${FTP_PASSWORD}" \
                -T "${FILE}" "${FTP_URL}"
            fi
          done
