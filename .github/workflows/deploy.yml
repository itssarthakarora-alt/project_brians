# Pipeline 1 — Deploy everything on GitHub to GoDaddy cPanel
#hi
name: Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy website via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Telegram token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for f in internal.php internal2.php; do
            if [ -f "$f" ]; then
              sed -i "s|__TELEGRAM_BOT_TOKEN__|${TELEGRAM_BOT_TOKEN}|g" "$f"
              if grep -q "__TELEGRAM_BOT_TOKEN__" "$f"; then
                echo "Token injection failed in $f — placeholder still present."
                exit 1
              fi
            else
              echo "Warning: $f not found, skipping."
              exit 1
            fi
          done

      - name: Deploy files to cPanel (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          server-dir: ./

          # Never upload these — they are also protected from deletion on the
          # server (this action syncs: remote files not in the repo get deleted).
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .gitignore
            README.md
            .well-known/**
            error_log
            .ftpquota
